 three lamps in my 150 sqft room, but something was still missing. The lighting worked, but it did not feel right for long hours at the desk.\n\nAt some point, I started looking into monitor light bars. On paper, they seemed like the perfect solution. However, they had two problems.\n1. First, they are not diffused. Since they sit on top of the monitor, the light falls directly onto the desk. It lights up the surface, but it does not improve the overall atmosphere.\n2. Second, the good ones are expensive. Some of them cost almost a third of my monitor. The cheaper options either look out of place or miss important features.\n\nSo instead of trying to pick the least bad option, I decided to approach the problem differently.\n\n## Discovery\n\nThat is when I came across [*WLED*](https://github.com/wled/WLED).\n\nIt is an open source firmware that lets you control LED strips with a lot of flexibility. Brightness, colors, effects, all accessible through a simple web interface.\n\nThe setup looked straight forward, and there were enough guides online to make it approachable.\n\nInstead of placing a light source in front of me, I could place it behind the monitor and let the light reflect off the wall.\n\n![big-brain](https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnp1a2tjYXFpenN3MXUwN3VoODdpZnBtN3k1NDd1eTcxNTV4aGx0ZCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/d3mlE7uhX8KFgEmY/giphy.gif)\n\n## Components\n\nI used an ESP32 and a WS2812B LED strip.\n\nI am pretty sure technical terms don't confuse you but here's what they are - \n\u003e ESP32 - An esp32 is a cheap ass microcontroller with built in wifi and bluettoth, which makes it great for almost all kinds iot work..,except things that require an OS. You can find one at [Amazon](https://www.amazon.in/s?k=esp32\u0026crid=2PX6N4RW2ENEA\u0026sprefix=esp,aps,389) for 300-400 INR.\n\u003e\n\u003e WS2812B - WS2812B is an individually addressable RGB LED with a control IC built in. It provides 24-bit color (8-bit per channel, and requires atleaset 5v and approx 60mA per LED. Here's the one I used: [Amazon Link](https://amzn.in/d/05pO0qgr)\n\nThe strip was mounted along the back of the monitor, facing the wall instead of facing outward. We solved the diffused lighting problem.\n\n## I know the pieces fit!\n\nI own a Dell S2725qc (Dim 61 * 37 cm), Perimeter = 196 cm ~ 2m lights should suffice.\n\nSome quick math\n```py\ntotal_leds = 120\nmax_cur_per_led = 60mA\n# All leds are in series\nmax_cur = 120*60 = 7.2A\nmax_vol = 5V\n```\nOkay, so 9A is a lot, and most power adapter doesn't can't output 9A at 5v. The PD charger I had has a rating of 5v@3.3A\nThe esp can output 5v but not more than 2A. We gotta comporoprise somewhere here - Let's (re)math -\n```py\n# Assuming 115 LEDs now, to save some energy\n# total_leds = 115\nmax_cur_per_led = 60mA\n\nmax_cur = 115 * 60  # = 6900mA = 6.9A\nmax_vol = 5V\n```\n\nStill bad.\n\nLike… optimistically bad, but bad.\n\nBecause this assumes every LED is running at full white brightness, which is basically the \"sun simulator\" mode. Not what we want anyway.\n\nAlso, my power situation:\nI wnated to power it directly from my monitor's usb 3.2 port (which prolly has a 20w out)\n\nSo instead of trying to brute force power like a maniac, I decided to… not buy an PSU.\n\nTwo key observations:\n1. I do not need full brightness\n2. I am not running all LEDs at full white all the time\n\nWLED actually makes this easy. It has a brightness limiter and global brightness control.\n\nSo instead of designing for worst case, I designed for actual usage.\n\nLet’s say:\n\nBrightness capped at ~30%\nMostly warm tones (not full RGB white - Which is the case 99% of the time)\n\nThat brings power consumption way down.\n\nA rough approximation:\n```py\neffective_cur = max_cur * 0.3  # ~30% brightness\n# 6.9A * 0.3 ~= 2.07A\n```\nNow we are within range. So we can power the entire thing with  ESP's 5v out port itself. I will attach some wiring images below, refer to that. I have also added a 100microfarad capacitor to reduce flickering.\n\n## Wiring\n\nNothing fancy here. Three wires.\n\n- **5V** from ESP's 5v pin → red wire on LED strip\n- **GND** from ESP → white wire on LED strip  \n- **GPIO 16** → data wire on LED strip (yellow or green, depends on your strip)\n\nThe 100µF capacitor goes across the 5V and GND lines, as close to the strip's input as possible. It smooths out the initial power surge when the strip boots up. Without it, the first few LEDs tend to flash white for a split second. Not a big deal but annoying once you notice it.\n\nOne thing I got wrong the first time — I connected the data line without a resistor. WLED's docs recommend a 300-500Ω resistor on the data line to protect against voltage spikes. I added a 330Ω one after the fact. The strip worked fine without it, but it's good practice.\n\n## Flashing WLED\n\nThis part is genuinely easy. WLED has a web flasher now — [install.wled.me](https://install.wled.me). Plug the ESP32 in via USB, open the page in Chrome (needs Web Serial API, so Chrome/Edge only), click install, done.\n\nIf that doesn't work for some reason — maybe your ESP32 has a CH340 chip and the driver isn't installed — you can flash manually with `esptool`:\n\n```py\nesptool.py --chip esp32 --port /dev/ttyUSB0 write_flash 0x0 WLED_0.15.0_ESP32.bin\n```\n\nFirst boot, it creates a WiFi hotspot called `WLED-AP`. Connect to it, open `4.3.2.1` in a browser, configure your home WiFi. After that it lives on your network like any other device.\n\n## Configuring WLED\n\nGo to the IP address WLED gets from your router. The interface is a bit overwhelming at first — there are a lot of options. But the only ones that actually matter for the initial setup:\n\n**LED Preferences:**\n- LED count: 120 (or however many you have)\n- GPIO: 16 (whatever pin you used)\n- Color order: GRB (for WS2812B, it's almost always GRB not RGB — if your colors look wrong, this is why)\n\n**Power Management:**\n- Max current: set this to whatever your power source can handle. I set mine to 1500mA to stay safely within the monitor USB port's output.\n\nThat's it. The rest — effects, palettes, presets — you figure out as you go. I spent way too long on this part.\n\n## Enter HyperHDR\n\nSo the static bias lighting was already great. But then I found out about [HyperHDR](https://github.com/awawa-dev/HyperHDR).\n\nHyperHDR is a screen ambient lighting application. It captures what's on your screen in real time and pushes the average colors from each edge to the corresponding LEDs. So if there's a sunset scene in a video, the wall behind your monitor actually glows orange. \n\nThis is where the project went from \"nice desk light\" to \"I might have a problem.\"\n\nI run it on a Raspberry Pi that already handles a few other things on my network. But you can run it on any machine — Windows, Linux, Mac.\n\nSetup:\n\n1. Install HyperHDR on whatever machine you want as the \"server\"\n2. In WLED, go to **Config → LED Preferences** and enable the **E1.31 / Artnet** protocol (or just use the HyperHDR UDP option — simpler)\n3. In HyperHDR, add a new LED output, select **Adalight / WLED** or **UDP**, point it at your ESP's IP\n\nThe trickiest part is telling HyperHDR how your LEDs are physically laid out — which LED is at which position on the screen edge. You define this as a matrix. For a monitor-back setup, it's a U-shape going left edge → bottom → right edge.\n\nMine looks like this (roughly):\n\n```\nLeft column:  LEDs 0-29   (bottom to top)\nBottom row:   LEDs 30-79  (left to right)\nRight column: LEDs 80-119 (top to bottom)\n```\n\nThere's a LED layout generator on the HyperHDR wiki that helps. Use it. Doing it manually is miserable.\n\n## The Result\n\nIt works really well. Like, better than I expected.\n\nFor normal work — reading, coding — I run a warm static preset in WLED. Soft amber. No effects, no patterns. Just a consistent glow that makes the monitor feel less like a rectangle floating in the dark.\n\nFor movies or YouTube, I switch HyperHDR on. The ambient sync is genuinely immersive. Not in a gimmicky way — it just extends the color space of what you're watching past the screen border. Your peripheral vision picks it up and the whole experience feels more expansive.\n\nTotal cost came out to around ₹900 — ESP32 (~₹350), LED strip (~₹450), random resistors and capacitor from a components kit I already had. Less than a tenth of what a decent monitor light bar costs, with way more control over the output.\n\nThe only thing I would do differently: route the USB cable more cleanly. Right now it's dangling off the back of the monitor and it bothers me every time I notice it. This is a future-me problem.\n\nIf you want to replicate this, the WLED docs are genuinely good. Start there. Most of the confusion I had early on was solved by just reading them properly instead of trying to shortcut through YouTube tutorials.\n\nAlso — if you're thinking \"I could just buy a Govee LED strip for ₹1500 and skip all of this\" — you could. It's fine. But you wouldn't learn anything, you'd be locked into their app, and it wouldn't be nearly as satisfying when it works.\n"])</script><script>self.__next_f.push([1,"6:Te95,"])</script><script>self.__next_f.push([1,"\nOver the last few months, I’ve been gradually building a **home server** that I actually *use* every day. Why? You may ask, basically to be free of the usual internet (and also because Gilfoyle from silicon valley conviced me to build my own Anton).\n\nThis blog walks through **why I built it, what I’m running, and how everything fits together**.\n\n\n## Why I Built a Home Server\n\nAs a backend engineer, I wanted more than just a VPS:\n\n- Full **control over infrastructure** (while AWS and GCP are good, all the internal workings are kinda abstracted)\n- A place to **experiment safely** ()\n- A deeper understanding of **networking, Linux, Docker, and automation**\n- Most importantly, A Media Server (I was soo tired of having multiple streaming platforms just not having the content I wanna watch!)\n\n\n## Hardware\n\nA beat up lenovo ideapad that I got in my first year of college for less than 60,000 INR (~650$)\n\nThis runs 24/7 without noticeable power or fan noise.\n\n## Operating System \u0026 Base Setup\n\nI’m running a **Debian 12** server.\n\nKey choices:\n- No desktop environment\n- SSH-only access\n- Firewall enabled\n- Automatic security updates\n- Custom SSH port + key-based login only\n\nKeeping the OS minimal reduces attack surface and keeps maintenance simple.\n\n## Containerization with Docker\n\nEverything runs inside **Docker containers**, managed via Docker Compose.\n\nWhy Docker?\n- Clean isolation\n- Easy upgrades\n- Reproducible setup\n- Fast rollback if something breaks\n\nEach service lives in its own compose file with persistent volumes mapped to disk.\n\n## Services I’m Running\n\n### 1. Reverse Proxy \u0026 SSL\nAll services are routed through a reverse proxy:\n- Automatic HTTPS\n- One public IP, many services\n- Clean subdomain-based routing\n\n### 2. Home Automation\nI run Home Assistant on a docker container,  this controls all my lights, wled, matter devices. I have fallen in love with home assistant and now wanna buy more smart devices to add to my dashbord.\n\n### 3. Media\n\nThe idea of owing your own media? hell yeah! Hence the second thing I installed on my server is Jellyfin and *arr services (again, everything on docker). A qbittorrent client (ofc to find/read books). The app i love the most now a days is called [Seer](https://github.com/seerr-team/seerr)...I will attach screenshots below.\n\n### 4. Monitoring \u0026 Logs\n- System metrics (CPU, memory, disk)\n- Container health checks\n- Logs centralized for debugging\n\nIf something breaks, I know *why*.\n\n## Networking \u0026 Remote Access\n\nMy ISP doesn’t provide a static IP, so I use:\n- Dynamic DNS\n- Reverse tunneling for secure access\n- No exposed services without authentication\n\nSecurity always comes before convenience.\n\n## Backups \u0026 Data Safety\n\nOne rule: **assume the disk will fail**.\n\nMy strategy:\n- Nightly backups to a secondary drive\n- Configuration files version-controlled\n- Encrypted backups for sensitive data\n\nRebuilding the server from scratch takes under an hour.\n\n## What I Learned\n\nThis setup taught me more than most cloud tutorials ever could:\n\n- Linux internals\n- Real networking (NAT, DNS, ports)\n- Docker\n- Security tradeoffs\n\nMost importantly, it gave me **confidence**. I know exactly what’s running, where my data lives, and how to fix things when they break.\n\n## What’s Next\n\nPlanned upgrades:\n- LLM inference (Mostly LlamaIndex)\n- Smarter monitoring \u0026 alerting\n- Power usage optimization\n- Host this website on my home server (maybe)\n\nThis server isn’t “done”—it’s a living system.\n\n## Final Thoughts\n\nA home server isn’t about replacing the cloud.  \nIt’s about **understanding it**.\n\nIf you’re a developer who enjoys building systems end-to-end, I highly recommend setting one up. Start small. Break things. Learn fast.\n"])</script><script>self.__next_f.push([1,"7:T43f,\n# Distributed Task Processing\n\nA highly scalable distributed task processing system built on Celery, capable of handling over 10,000 concurrent operations with robust fault tolerance and monitoring.\n\n## Overview\n\nDesigned and implemented a production-grade distributed task queue system to handle high-volume background processing for web applications at scale.\n\n## Key Features\n\n- **10k+ Concurrent Operations**: Efficiently processes thousands of tasks simultaneously\n- **Redis Clustering**: High-availability message broker with failover support\n- **PostgreSQL Optimization**: Optimized database queries and connection pooling\n- **Monitoring \u0026 Observability**: Comprehensive metrics and alerting\n\n## Technical Architecture\n\nThe system leverages:\n- **Celery** for distributed task execution\n- **Redis** as the message broker and result backend\n- **PostgreSQL** for persistent storage with advanced optimization\n- **Python** for worker implementation\n\n## Performance\n\nAchieved 99.9% uptime with average task processing time under 100ms and automatic retry mechanisms for failed tasks.\n8:T865,"])</script><script>self.__next_f.push([1,"\nHere's a journey of how we build a smart web crawler before FireCrawl/etc existed.\n\n## Story Time\n\n(you may skip if you want)\n\nOur task of building a smart web scrapper began when we tried to make a web srapper for web-archive/internet-archive. As you know, web archive is a corpus of massive snapshots of evey websites possible for the past 20 years.\n\nInitial implementation used scrapy (python) package to write custom webscrappers...but this got tedious too soon. We (team of 2) started to look out for better solutions.\n\n### Phase 1\n\n**Enter, the AI based scrapper**. This is where it all began, we realised that we can parse HTML pages as it is, convert the content to markdown and with the help of LLMs it's quite easy to classify each section. Parsing HTML to md wasn't very difficult either. This worked great for the PoC.\n\nBut this didn't scaled well, because of the following reasons:\n\n1. Markdown conversion was lossy, critical DOM structure, hierarchy, and semantic context are discarded during conversion.\n2. Boilerplate content overwhelms signal, causing navigation, footers, and legal text to be misclassified as meaningful sections.\n3. Section boundaries become ambiguous, forcing the LLM to guess structural intent from flattened text.\n4. Images, pdfs and js-rendered content is often incomplete or missing, leading to inconsistent or partial extractions.\n5. Token usage scales poorly, as markdown inflates content size and forces aggressive chunking.\n6. Expensive AF!\n\n\n### Phase 2\n\n**RAG Approach** - \n\n\n## Key Features\n\n- **98% Retrieval Precision**: Achieved industry-leading accuracy in document retrieval\n- **Automated Content Optimization**: ML-powered content enhancement and SEO optimization\n- **Scalable Architecture**: Handles millions of documents with sub-second query times\n- **Vector Database Integration**: Efficient semantic search using state-of-the-art embeddings\n\n## Technical Stack\n\nPython, LangChain, Redis Queues (Yes, This exists), Qdrant (Open-source Vector DB)\n\n## Impact\n\nDeployed to production serving thousands of daily queries with consistent sub-second response times and 98% user satisfaction rate.\n"])</script><script>self.__next_f.push([1,"9:T117b,"])</script><script>self.__next_f.push([1,"\n# Making 3D Models Dance in Python\n\nSo I spent Summer 2022 teaching a scientific visualization library how to load modern 3D files and make them move. Turns out getting a virtual fox to do backflips involves a lot more math than you'd think.\n\n## What's This All About?\n\nFURY is this cool Python library that scientists use to visualize medical scans and research data. The problem? It couldn't load glTF files (the standard 3D format everyone uses these days) or animate anything. My mission was to fix that.\n\n![Loading glTF models with textures](https://user-images.githubusercontent.com/74976752/174492510-b9f10816-3058-4a7b-a260-0627406354ba.png)\n\n*Finally getting textures to work was oddly satisfying*\n\n## The Journey: From \"It Loads!\" to \"It Moves!\"\n\nFirst challenge: loaded a model, and the textures were upside down. Classic. Turns out glTF thinks (0,0) is at the top-left, but VTK (what FURY uses) wants it at the bottom-left. One coordinate flip later, we were in business.\n\n### Simple Animations (The Easy Part)\n\nSo I thought, But it was far from easy. First of all, I had no clue how animations work behind the scene. So I went to the library, picked up the Computer Graphics book and applied a binary search on the content. I had a basic gist of how things work now. Also, huge thanks to [Mohamed](https://github.com/m-agour) for explaining the animation pipeline that he wrote. Got basic translation, rotation, and scaling working pretty quickly. Convert some binary data to NumPy arrays, hook up a timeline, boom! things move.\n\n![Simple animations in action](https://user-images.githubusercontent.com/74976752/217645594-6054ea83-12e5-4868-b6a1-eee5a154bd26.gif)\n\n*I was in love with these Spinning boxes*\n\n### Morphing: When Cubes Get Weird\n\nMorphing is basically vertex animation, you tell each vertex \"hey, move over here a bit\" and blend between poses. Implementing this meant wrestling with morph targets and weighted blending. But when it finally worked...\n\n![Morphing animation demo](https://user-images.githubusercontent.com/74976752/217645485-153ec403-6c87-4282-8907-30d921106b34.gif)\n\n*The AnimatedMorphCube doing its thing*\n\nAt this point, I would show any of these features to my friends, They will say \"I'm a mad scientist\", and I'm obsessed with cubes.\n\n### Skeletal Animation: The Final Boss\n\nThis is where things got spicy. Skeletal animation means deforming a mesh based on bone movements. Sounds simple until you're debugging why the CesiumMan model looks like a pretzel.\n\nThe breakthrough came in week 13 when I figured out the hierarchical timeline system. Each bone gets its own timeline, and you have to respect parent-child relationships. The magic formula became:\n\n```\nSkinMatrix = InverseBindPose * BoneDeform\nwhere BoneDeform = CurrentBoneTransform * ParentBoneTransform\n```\n\n![Skeletal animation working](https://user-images.githubusercontent.com/74976752/217645367-f901c6ed-ca20-40d6-92dd-f1cd8899ac7a.gif)\n\n*When the bones finally cooperate*\n\nThe real celebration moment was getting multiple actors to work simultaneously. [Here's the BrainStem model demo](https://user-images.githubusercontent.com/74976752/193109340-2e37c255-139b-499f-a932-b8c0290bb481.mp4) showing multiple parts animating together.\n\n## The Nerdy Details\n\nBuilt with Python, OpenGL/VTK for rendering, and way too many hours staring at matrix multiplication order. Some fun challenges:\n\n- **The Inverse Bind Matrix Mystery**: Took a while to understand it \"undoes\" the model's bind pose. Can't just multiply it with weights—learned that the hard way.\n- **Coordinate System Shenanigans**: glTF's top-left origin vs VTK's bottom-left origin\n- **Parent Transforms**: Realizing parent transformations were already baked into the actor construction saved a ton of redundant calculations\n- **Multiple Animations**: Making different parts animate at the same time without breaking everything\n\n## What Got Merged\n\nShipped 5 major features and 5 smaller patches across 14 weeks:\n- [Basic glTF import](https://github.com/fury-gl/fury/pull/600)\n- [Scene export to glTF](https://github.com/fury-gl/fury/pull/630)\n- [Model fetcher](https://github.com/fury-gl/fury/pull/602)\n- [Simple animations](https://github.com/fury-gl/fury/pull/643)\n- [Skeletal animation](https://github.com/fury-gl/fury/pull/685)\n- [Morphing support](https://github.com/fury-gl/fury/pull/700)\n\nPBR implementation is still pending, but it will be really cool to see some development on the PBR sides.\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"c\":[\"\",\"\"],\"q\":\"\",\"i\":false,\"f\":[[[\"\",{\"children\":[\"__PAGE__\",{}]},\"$undefined\",\"$undefined\",16],[[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/117ze4z.i.cs6.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/01xlw8hd842-c.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-1\",{\"src\":\"/_next/static/chunks/0d3shmwh5_nmn.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"className\":\"dark\",\"suppressHydrationWarning\":true,\"children\":[\"$\",\"body\",null,{\"children\":[\"$\",\"$L2\",null,{\"parallelRouterKe
